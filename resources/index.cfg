<?xml version="1.0" encoding="UTF-8"?>
<configuration kit="high_dpi_scaling" version="1.1.1">
  <import>kit_high_dpi_scaling:</import>

  <!-- "Interface Scaling" in System -> Preferences -> Defaults -> UI -->
  <atom type="Attributes">
    <hash type="Sheet" key="HighDPIScaling_InterfaceScaling:sheet">
      <atom type="Label">Interface Scaling</atom>
      <atom type="Filter">prefs/defaults/UI:filterPreset</atom>
      <hash type="InCategory" key="prefs:general#head">
        <atom type="Ordinal">128</atom>
      </hash>
      <atom type="Group">prefs</atom>

      <list type="Control" val="cmd high_dpi_scaling.mode ?">
        <atom type="Label">Scaling Mode</atom>
      </list>

      <list type="Control" val="cmd high_dpi_scaling.custom_scale ?">
        <atom type="Label">Custom Scaling Factor</atom>
        <atom type="Subtext">Set interface scaling and relaunch the application to take effect</atom>
        <atom type="ShowWhenDisabled">1</atom>
      </list>
    </hash>

    <!-- "High-DPI Scaling -> GitHub Repository..." in Help -> Kit Help -->
    <hash type="Sheet" key="HighDPIScaling_KitHelp:sheet">
      <atom type="Label">High-DPI Scaling</atom>
      <atom type="Style">popup</atom>
      <hash type="InCategory" key="ExtensionHelp:sheet#tail">
        <atom type="Ordinal">128</atom>
      </hash>

      <list type="Control" val="cmd openURL {https://github.com/iouzzr/modo_high_dpi_scaling}">
        <atom type="Label">GitHub Repository...</atom>
      </list>
    </hash>
  </atom>

  <atom type="CommandHelp">
    <hash type="Command" key="high_dpi_scaling.mode@en_US">
      <atom type="UserName">Scaling Mode</atom>
      <hash type="Argument" key="mode">
        <atom type="UserName">Scaling Mode</atom>
        <atom type="ArgumentType">high_dpi_scaling-mode</atom>
      </hash>
    </hash>

    <hash type="Command" key="high_dpi_scaling.custom_scale@en_US">
      <atom type="UserName">Custom Scaling Factor</atom>
      <atom type="Desc">Set the custom interface scaling factor when Scaling Mode is set to &quot;Use Custom Scaling&quot;.</atom>
      <hash type="Argument" key="scale">
        <atom type="UserName">Custom Scaling Factor</atom>
      </hash>
    </hash>

    <hash type="ArgumentType" key="high_dpi_scaling-mode@en_US">
      <atom type="UserName">Scaling Mode</atom>
      <atom type="Desc">Set how the application interface is scaled on high-DPI displays.</atom>
      <hash type="Option" key="system">
        <atom type="UserName">Use System Setting</atom>
        <atom type="Desc">Automatically scale the interface based on the operating system display DPI setting.</atom>
      </hash>
      <hash type="Option" key="custom">
        <atom type="UserName">Use Custom Scaling</atom>
        <atom type="Desc">Scale the interface using the percentage specified in Custom Scaling Factor.</atom>
      </hash>
      <hash type="Option" key="none">
        <atom type="UserName">Do Not Scale</atom>
        <atom type="Desc">Disable interface scaling and render at native 1:1 pixel resolution (100%).</atom>
      </hash>
    </hash>
  </atom>

  <atom type="Messages">
    <hash type="Table" key="high_dpi_scaling.custom_scale.en_US">
      <hash type="T" key="DisabledReason">Only available when &quot;Use Custom Scaling&quot; is selected.</hash>
    </hash>
  </atom>
</configuration>
